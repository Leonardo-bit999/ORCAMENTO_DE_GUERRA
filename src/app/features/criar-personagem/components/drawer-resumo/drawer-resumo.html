<!-- Botão flutuante (só aparece quando o drawer está fechado) -->
@if (!aberto) {
  <button
    type="button"
    class="drawer-fab"
    aria-label="Ver resumo do personagem"
    (click)="fechar.emit()"
    style="display: none"
  ></button>
}

<!-- Overlay + drawer -->
@if (aberto) {
  <div
    class="drawer-overlay"
    role="dialog"
    aria-modal="true"
    aria-label="Resumo do personagem"
    (click)="clicarFundo($event)"
  >
    <aside class="drawer-painel">
      <header class="drawer-header">
        <span class="drawer-arraste" aria-hidden="true"></span>
        <button
          type="button"
          class="drawer-fechar"
          aria-label="Fechar resumo"
          (click)="fechar.emit()"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M6 6 18 18M6 18 18 6"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>
        </button>
      </header>

      <div class="drawer-conteudo">
        <app-etapa-resumo />
      </div>
    </aside>
  </div>
}
