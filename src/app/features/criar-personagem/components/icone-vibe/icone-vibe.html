<svg
  viewBox="0 0 24 24"
  class="icone"
  fill="none"
  stroke="currentColor"
  stroke-width="1.6"
  stroke-linecap="round"
  stroke-linejoin="round"
  aria-hidden="true"
>
  <ng-container [ngSwitch]="id">
    <!-- SOCIAL: pessoas -->
    <g *ngSwitchCase="'social'">
      <circle cx="9" cy="8" r="3" />
      <circle cx="17" cy="9" r="2.5" />
      <path d="M3 19c0-3 2.7-5 6-5s6 2 6 5" />
      <path d="M15 19c0-2 1.3-3.5 3-3.5s3 1.5 3 3.5" />
    </g>

    <!-- CASEIRO: casa com coração -->
    <g *ngSwitchCase="'caseiro'">
      <path d="M3 11 12 4l9 7" />
      <path d="M5 10v10h14V10" />
      <path d="M12 15c-1.5-1.5-3 .5-3 1.5 0 1.5 3 3.5 3 3.5s3-2 3-3.5c0-1-1.5-3-3-1.5Z" fill="currentColor" stroke="none" />
    </g>

    <!-- FITNESS: halter -->
    <g *ngSwitchCase="'fitness'">
      <path d="M5 8v8M2 10v4M19 8v8M22 10v4" />
      <path d="M5 12h14" />
    </g>

    <!-- GEEK: monitor com código -->
    <g *ngSwitchCase="'geek'">
      <rect x="3" y="4" width="18" height="13" rx="2" />
      <path d="M8 21h8M12 17v4" />
      <path d="m9.5 9.5-2 2 2 2M14.5 9.5l2 2-2 2" />
    </g>

    <!-- CRIATIVO: paleta -->
    <g *ngSwitchCase="'criativo'">
      <path d="M12 3a9 9 0 1 0 0 18h1.5a2 2 0 0 0 1.3-3.5c-.8-.7-.3-2 .8-2H17a4 4 0 0 0 4-4 9 9 0 0 0-9-8.5Z" />
      <circle cx="7.5" cy="11.5" r="1" fill="currentColor" stroke="none" />
      <circle cx="10" cy="7.5" r="1" fill="currentColor" stroke="none" />
      <circle cx="15" cy="7.5" r="1" fill="currentColor" stroke="none" />
      <circle cx="18" cy="11" r="1" fill="currentColor" stroke="none" />
    </g>
  </ng-container>
</svg>
