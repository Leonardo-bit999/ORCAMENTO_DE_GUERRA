<div class="avatares" role="radiogroup" aria-label="Escolha um avatar">
  <button
    *ngFor="let a of avatares; let i = index"
    type="button"
    role="radio"
    class="avatar"
    [class.selecionado]="selecionado === a"
    [attr.aria-checked]="selecionado === a"
    [attr.aria-label]="'Avatar ' + (i + 1)"
    (click)="selecionar.emit(a)"
  >
    <svg viewBox="0 0 64 64" class="avatar-svg">
      <!-- cabeça -->
      <circle cx="32" cy="26" r="13" [attr.fill]="corDe(a)" opacity="0.9" />
      <!-- corpo -->
      <path
        d="M12 56c2-11 10-16 20-16s18 5 20 16"
        [attr.fill]="corDe(a)"
        opacity="0.55"
      />
      <!-- inicial do índice (decorativa) -->
      <text
        x="32"
        y="31"
        text-anchor="middle"
        font-family="monospace"
        font-size="12"
        font-weight="700"
        fill="#0B0D0F"
      >{{ i + 1 }}</text>
    </svg>

    <span class="avatar-check" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        <path
          d="m5 12 5 5 9-11"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </span>
  </button>
</div>
