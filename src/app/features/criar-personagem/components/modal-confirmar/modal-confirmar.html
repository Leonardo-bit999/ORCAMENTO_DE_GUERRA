<div class="modal-overlay" (click)="clicarFora($event)">
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
    <header class="modal-header">
      <span class="modal-eyebrow">Tudo pronto?</span>
      <h2 id="modal-titulo" class="modal-titulo">
        Começar a campanha deste personagem?
      </h2>
      <p class="modal-sub">
        Esta é a versão inicial dele. Você poderá ajustar o personagem depois
        nas configurações.
      </p>
    </header>

    <div class="modal-resumo">
      <div class="modal-linha">
        <span class="modal-chave">Personagem</span>
        <span class="modal-valor">{{ nome }}</span>
      </div>
      <div class="modal-linha">
        <span class="modal-chave">Perfil</span>
        <span class="modal-valor">{{ perfil }}</span>
      </div>
      <div class="modal-linha">
        <span class="modal-chave">Saldo inicial</span>
        <span class="modal-valor verde">R$ {{ saldo }}</span>
      </div>
      <div class="modal-linha">
        <span class="modal-chave">Reserva inicial</span>
        <span class="modal-valor verde">R$ {{ reserva }}</span>
      </div>
    </div>

    <footer class="modal-acoes">
      <button
        type="button"
        class="btn-ghost"
        [disabled]="carregando"
        (click)="cancelar.emit()"
      >
        Voltar e editar
      </button>

      <button
        type="button"
        class="btn-primario"
        [disabled]="carregando"
        (click)="confirmar.emit()"
      >
        <span *ngIf="!carregando">
          Começar campanha
          <svg viewBox="0 0 24 24" class="btn-seta">
            <path
              d="M5 12h14M13 6l6 6-6 6"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </span>
        <span *ngIf="carregando" class="modal-carregando">
          <span class="modal-spinner" aria-hidden="true"></span>
          Criando campanha...
        </span>
      </button>
    </footer>
  </div>
</div>
