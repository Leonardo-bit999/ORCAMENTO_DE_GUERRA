<section class="etapa">
  <header class="etapa-header">
    <h1 class="etapa-titulo">Crie seu personagem</h1>
    <p class="etapa-sub">Monte o personagem que vai enfrentar esta campanha.</p>
  </header>

  <div class="dados-personagem">
    <!-- NOME -->
    <div class="grupo nome-bloco">
      <div class="campo" [class.invalido]="nomeInvalido">
        <label for="perfil-nome">Nome do personagem</label>
        <div class="input-wrap">
          <input
            id="perfil-nome"
            type="text"
            [value]="draft().nome"
            (input)="setNome($any($event.target).value)"
            placeholder="Como devemos chamar?"
            autocomplete="off"
            maxlength="32"
          />
        </div>
        <small class="erro" *ngIf="nomeInvalido">
          O nome precisa ter ao menos 2 caracteres.
        </small>
      </div>
    </div>

    <!-- AVATAR -->
    <div class="grupo avatar-bloco">
      <span class="grupo-label">Escolha um avatar</span>
      
    </div>
  </div>

  <!-- PERFIL -->
  <div class="grupo">
    <span class="grupo-label">Escolha seu ponto de partida</span>

    <div class="grid-cards">
      <app-opcao-card
        *ngFor="let p of perfis"
        [titulo]="p.titulo"
        [frase]="p.frase"
        [bullets]="p.bullets"
        [destaque]="p.id !== 'personalizado' ? ('Saldo: R$ ' + p.saldoInicial) : ''"
        [destaque2]="p.id !== 'personalizado' ? ('Reserva: R$ ' + p.reservaInicial) : ''"
        [rodape]="p.objetivoSugerido"
        [selecionado]="draft().perfilId === p.id"
        (selecionar)="selecionarPerfil(p.id)"
      ></app-opcao-card>
    </div>
  </div>

  <!-- BLOCO PERSONALIZADO -->
  <div class="personalizado" *ngIf="ehPersonalizado()">
    <header class="personalizado-header">
      <span class="personalizado-tag">Configuração personalizada</span>
      <p class="personalizado-sub">
        Defina o núcleo financeiro do seu personagem. Todos os campos são
        obrigatórios.
      </p>
    </header>

    <div class="personalizado-grid">
      <div class="campo">
        <label for="p-renda">Renda mensal (R$)</label>
        <div class="input-wrap">
          <input
            id="p-renda"
            type="number"
            min="0"
            step="50"
            [value]="draft().personalizado.rendaMensal ?? ''"
            (input)="setPersonalizadoRenda($any($event.target).value)"
            placeholder="1200"
          />
        </div>
      </div>

      <div class="campo">
        <label for="p-saldo">Saldo inicial (R$)</label>
        <div class="input-wrap">
          <input
            id="p-saldo"
            type="number"
            min="0"
            step="50"
            [value]="draft().personalizado.saldoInicial ?? ''"
            (input)="setPersonalizadoSaldo($any($event.target).value)"
            placeholder="500"
          />
        </div>
      </div>

      <div class="campo">
        <label for="p-reserva">Reserva inicial (R$)</label>
        <div class="input-wrap">
          <input
            id="p-reserva"
            type="number"
            min="0"
            step="50"
            [value]="draft().personalizado.reservaInicial ?? ''"
            (input)="setPersonalizadoReserva($any($event.target).value)"
            placeholder="200"
          />
        </div>
      </div>
    </div>
  </div>
</section>
