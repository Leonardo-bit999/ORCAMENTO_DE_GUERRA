<section class="etapa">
  <header class="etapa-header">
    <h1 class="etapa-titulo">Crie seu personagem</h1>
    <p class="etapa-sub">Monte o personagem que vai enfrentar esta campanha.</p>
  </header>

  <section class="grupo" aria-labelledby="perfil-nome-label">
    <div class="campo" [class.invalido]="nomeInvalido">
      <label id="perfil-nome-label" for="perfil-nome">Nome do personagem</label>
      <div class="input-wrap">
        <input
          id="perfil-nome"
          type="text"
          [value]="draft().nome"
          (input)="setNome($any($event.target).value)"
          placeholder="Como devemos chamar?"
          autocomplete="off"
          maxlength="32"
        />
      </div>
      @if (nomeInvalido) {
        <small class="erro">O nome precisa ter ao menos 2 caracteres.</small>
      }
    </div>
  </section>

  <section class="grupo" aria-labelledby="perfil-partida-label">
    <span id="perfil-partida-label" class="grupo-label"> Escolha seu ponto de partida </span>

    <ul class="lista-perfis">
      @for (p of perfis; track p.id) {
        <li>
          <button
            type="button"
            class="perfil-card"
            [class.selecionado]="draft().perfilId === p.id"
            [attr.aria-pressed]="draft().perfilId === p.id"
            (click)="selecionarPerfil(p.id)"
          >
            <span class="perfil-icone" aria-hidden="true">
              <app-icone-perfil [id]="p.id" />
            </span>

            <span class="perfil-conteudo">
              <span class="perfil-titulo">{{ p.titulo }}</span>
              <span class="perfil-frase">{{ p.frase }}</span>

              <span class="perfil-valores">
                <span class="perfil-valor"> Saldo: {{ formatarMoeda(p.saldoInicial) }} </span>
                <span class="perfil-valor"> Reserva: {{ formatarMoeda(p.reservaInicial) }} </span>
              </span>

              <span class="perfil-objetivo">
                <span class="perfil-objetivo-label">Objetivo sugerido</span>
                {{ p.objetivoSugerido }}
              </span>
            </span>

            <span class="perfil-check" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path
                  d="m5 12 5 5 9-11"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="3"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </span>
          </button>
        </li>
      }
    </ul>
  </section>
</section>
