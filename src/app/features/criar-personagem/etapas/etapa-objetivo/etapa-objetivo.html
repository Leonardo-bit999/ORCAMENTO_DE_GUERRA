<section class="etapa">
  <header class="etapa-header">
    <h1 class="etapa-titulo">Qual é a principal missão deste personagem?</h1>
    <p class="etapa-sub">
      Escolha o foco da campanha. Você poderá desbloquear outros objetivos
      durante o jogo.
    </p>
  </header>

  <section class="grupo" aria-labelledby="objetivo-label">
    <span id="objetivo-label" class="grupo-label">Objetivo principal</span>

    <ul class="grid-objetivos">
      @for (o of objetivos; track o.id) {
        <li>
          <app-opcao-tile
            [titulo]="o.label"
            [selecionado]="draft().objetivo === o.id"
            (selecionar)="selecionarObjetivo(o.id)"
          >
            <app-icone-objetivo slotIcone [id]="o.id" />
          </app-opcao-tile>
        </li>
      }
    </ul>
  </section>

  @if (ehOutro()) {
    <section class="grupo" aria-labelledby="objetivo-outro-label">
      <div class="campo" [class.invalido]="outroInvalido">
        <label id="objetivo-outro-label" for="objetivo-outro">
          Qual é o objetivo?
        </label>
        <div class="input-wrap">
          <input
            id="objetivo-outro"
            type="text"
            [value]="draft().objetivoOutroTexto"
            (input)="setOutroTexto($any($event.target).value)"
            placeholder="Ex: Juntar dinheiro para uma viagem"
            autocomplete="off"
            maxlength="80"
          />
        </div>
        @if (outroInvalido) {
          <small class="erro">O objetivo precisa ter ao menos 2 caracteres.</small>
        }
      </div>
    </section>
  }
</section>
