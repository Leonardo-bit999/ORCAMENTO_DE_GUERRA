<form class="auth-form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
  <header class="form-header">
    <h1 class="form-titulo">Criar conta</h1>
    <p class="form-sub">Preencha os dados abaixo para começar.</p>
  </header>

  <div class="campo" [class.invalido]="f.nome.touched && f.nome.invalid">
    <label for="nome">Nome</label>
    <div class="input-wrap">
      <svg class="input-icone" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="1.6" />
        <path
          d="M4 21c0-4 4-6 8-6s8 2 8 6"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
        />
      </svg>
      <input
        id="nome"
        type="text"
        formControlName="nome"
        autocomplete="name"
        placeholder="Como devemos te chamar?"
      />
    </div>
    <small class="erro" *ngIf="f.nome.touched && f.nome.errors?.['required']">
      Informe seu nome.
    </small>
    <small class="erro" *ngIf="f.nome.touched && f.nome.errors?.['minlength']">
      Mínimo 3 caracteres.
    </small>
  </div>

  <div class="campo" [class.invalido]="f.email.touched && f.email.invalid">
    <label for="email">E-mail</label>
    <div class="input-wrap">
      <svg class="input-icone" viewBox="0 0 24 24" aria-hidden="true">
        <rect
          x="3"
          y="5"
          width="18"
          height="14"
          rx="2"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
        />
        <path
          d="m3 7 9 6 9-6"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
      <input
        id="email"
        type="email"
        formControlName="email"
        autocomplete="email"
        placeholder="seu@email.com"
      />
    </div>
    <small class="erro" *ngIf="f.email.touched && f.email.errors?.['required']">
      Informe seu e-mail.
    </small>
    <small class="erro" *ngIf="f.email.touched && f.email.errors?.['email']">
      E-mail inválido.
    </small>
  </div>

  <div class="campo" [class.invalido]="f.senha.touched && f.senha.invalid">
    <label for="senha">Senha</label>
    <div class="input-wrap">
      <svg class="input-icone" viewBox="0 0 24 24" aria-hidden="true">
        <rect
          x="4"
          y="10"
          width="16"
          height="10"
          rx="2"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
        />
        <path
          d="M8 10V7a4 4 0 0 1 8 0v3"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
        />
      </svg>
      <input
        id="senha"
        [type]="mostrarSenha() ? 'text' : 'password'"
        formControlName="senha"
        autocomplete="new-password"
        placeholder="Mínimo 8 caracteres"
      />
      <button
        type="button"
        class="btn-olho"
        (click)="toggleSenha()"
        [attr.aria-label]="mostrarSenha() ? 'Ocultar senha' : 'Mostrar senha'"
      >
        <svg
          class="olho olho-aberto"
          [class.ativo]="mostrarSenha()"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path
            d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linejoin="round"
          />
          <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.6" />
        </svg>
        <svg
          class="olho olho-fechado"
          [class.ativo]="!mostrarSenha()"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path
            d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linejoin="round"
          />
          <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.6" />
          <path
            d="M4 4 20 20"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />
        </svg>
      </button>
    </div>
    <small class="erro" *ngIf="f.senha.touched && f.senha.errors?.['required']">
      Informe uma senha.
    </small>
    <small class="erro" *ngIf="f.senha.touched && f.senha.errors?.['minlength']">
      A senha precisa ter ao menos 8 caracteres.
    </small>
  </div>

  <div
    class="campo"
    [class.invalido]="
      f.confirmarSenha.touched && (f.confirmarSenha.invalid || form.errors?.['senhasDiferentes'])
    "
  >
    <label for="confirmarSenha">Confirmar senha</label>
    <div class="input-wrap">
      <svg class="input-icone" viewBox="0 0 24 24" aria-hidden="true">
        <rect
          x="4"
          y="10"
          width="16"
          height="10"
          rx="2"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
        />
        <path
          d="M8 10V7a4 4 0 0 1 8 0v3"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
        />
        <path
          d="m9 15 2 2 4-4"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
      <input
        id="confirmarSenha"
        [type]="mostrarConfirmar() ? 'text' : 'password'"
        formControlName="confirmarSenha"
        autocomplete="new-password"
        placeholder="Repita a senha"
      />
      <button
        type="button"
        class="btn-olho"
        (click)="toggleConfirmar()"
        [attr.aria-label]="mostrarConfirmar() ? 'Ocultar senha' : 'Mostrar senha'"
      >
        <svg
          class="olho olho-aberto"
          [class.ativo]="mostrarConfirmar()"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path
            d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linejoin="round"
          />
          <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.6" />
        </svg>
        <svg
          class="olho olho-fechado"
          [class.ativo]="!mostrarConfirmar()"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path
            d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linejoin="round"
          />
          <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.6" />
          <path
            d="M4 4 20 20"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />
        </svg>
      </button>
    </div>
    <small class="erro" *ngIf="f.confirmarSenha.touched && form.errors?.['senhasDiferentes']">
      As senhas não coincidem.
    </small>
  </div>

  <label class="termos" [class.invalido]="f.aceitaTermos.touched && f.aceitaTermos.invalid">
    <input type="checkbox" formControlName="aceitaTermos" />
    <span class="check-visual" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        <path
          d="m5 12 5 5 9-11"
          fill="none"
          stroke="currentColor"
          stroke-width="2.4"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </span>
    <span class="termos-texto">
      Li e aceito os
      <a routerLink="/termos" target="_blank" rel="noopener">Termos de Uso</a>
      e a
      <a routerLink="/privacidade" target="_blank" rel="noopener">Política de Privacidade</a>
      (LGPD).
    </span>
  </label>

  <p class="erro-servidor" *ngIf="erroServidor()">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6" />
      <path
        d="M12 7v6M12 16.5v.5"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
      />
    </svg>
    <span>{{ erroServidor() }}</span>
  </p>

  <button type="submit" class="btn-primario" [disabled]="form.invalid || carregando()">
    <span *ngIf="!carregando()">
      Continuar
      <svg viewBox="0 0 24 24" aria-hidden="true" class="btn-seta">
        <path
          d="M5 12h14M13 6l6 6-6 6"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </span>
    <span *ngIf="carregando()" class="carregando">
      <span class="spinner" aria-hidden="true"></span>
      Criando conta...
    </span>
  </button>
</form>
