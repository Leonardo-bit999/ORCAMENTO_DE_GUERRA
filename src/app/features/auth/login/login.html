<form class="auth-form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
  <header class="form-header">
    <h1 class="form-titulo">Entrar</h1>
    <p class="form-sub">Acesse sua conta para continuar a campanha.</p>
  </header>

  <div class="campo" [class.invalido]="f.email.touched && f.email.invalid">
    <label for="login-email">E-mail</label>
    <div class="input-wrap">
      <svg class="input-icone" viewBox="0 0 24 24" aria-hidden="true">
        <rect
          x="3"
          y="5"
          width="18"
          height="14"
          rx="2"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
        />
        <path
          d="m3 7 9 6 9-6"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
      <input
        id="login-email"
        type="email"
        formControlName="email"
        autocomplete="email"
        placeholder="seu@email.com"
      />
    </div>
    <small class="erro" *ngIf="f.email.touched && f.email.errors?.['required']">
      Informe seu e-mail.
    </small>
    <small class="erro" *ngIf="f.email.touched && f.email.errors?.['email']">
      E-mail inválido.
    </small>
  </div>

  <div class="campo" [class.invalido]="f.senha.touched && f.senha.invalid">
    <label for="login-senha">Senha</label>
    <div class="input-wrap">
      <svg class="input-icone" viewBox="0 0 24 24" aria-hidden="true">
        <rect
          x="4"
          y="10"
          width="16"
          height="10"
          rx="2"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
        />
        <path
          d="M8 10V7a4 4 0 0 1 8 0v3"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
        />
      </svg>
      <input
        id="login-senha"
        [type]="mostrarSenha() ? 'text' : 'password'"
        formControlName="senha"
        autocomplete="current-password"
        placeholder="Sua senha"
      />
      <button
        type="button"
        class="btn-olho"
        (click)="toggleSenha()"
        [attr.aria-label]="mostrarSenha() ? 'Ocultar senha' : 'Mostrar senha'"
      >
        <svg
          class="olho olho-aberto"
          [class.ativo]="mostrarSenha()"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path
            d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linejoin="round"
          />
          <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.6" />
        </svg>
        <svg
          class="olho olho-fechado"
          [class.ativo]="!mostrarSenha()"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path
            d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linejoin="round"
          />
          <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.6" />
          <path
            d="M4 4 20 20"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />
        </svg>
      </button>
    </div>
    <small class="erro" *ngIf="f.senha.touched && f.senha.errors?.['required']">
      Informe sua senha.
    </small>
    <small class="erro" *ngIf="f.senha.touched && f.senha.errors?.['minlength']">
      A senha precisa ter ao menos 8 caracteres.
    </small>
  </div>

  <p class="erro-servidor" *ngIf="erroServidor()">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6" />
      <path
        d="M12 7v6M12 16.5v.5"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
      />
    </svg>
    <span>{{ erroServidor() }}</span>
  </p>

  <button type="submit" class="btn-primario" [disabled]="form.invalid || carregando()">
    <span *ngIf="!carregando()">
      Entrar
      <svg viewBox="0 0 24 24" aria-hidden="true" class="btn-seta">
        <path
          d="M5 12h14M13 6l6 6-6 6"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </span>
    <span *ngIf="carregando()" class="carregando">
      <span class="spinner" aria-hidden="true"></span>
      Entrando...
    </span>
  </button>
</form>
