<section class="cta-final" aria-labelledby="cta-titulo">
  <div class="cta-final-container">
    <div class="cta-final-conteudo">
      <span class="eyebrow">Sua vez</span>

      <h2 id="cta-titulo" class="cta-titulo">
        Sua jornada começa<br />
        com <span class="highlight">uma decisão.</span>
      </h2>

      <p class="cta-subtitulo">Não existe escolha certa. Existe o caminho que você constrói.</p>

      <a routerLink="/entrar" [queryParams]="{ tab: 'cadastro' }" class="cta-btn">
        Começar minha jornada
        <svg viewBox="0 0 24 24" class="cta-btn-seta" aria-hidden="true">
          <path
            d="M5 12h14M13 6l6 6-6 6"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </a>
    </div>
  </div>
</section>
