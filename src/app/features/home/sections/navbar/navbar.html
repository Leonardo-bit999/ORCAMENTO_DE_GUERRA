<header class="site-header">
  <nav class="site-nav container" aria-label="Navegação principal">
    <a class="brand" routerLink="/" aria-label="Orçamento de Guerra, início">
      <img
        class="brand-logo"
        src="/images/logo_Orcamento_de_Guerra_Horizontal.png"
        alt="Logo Orçamento de Guerra"
      />
    </a>

    <button
      class="menu-toggle"
      type="button"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="main-menu"
    >
      <span class="sr-only">Abrir menu</span>
      <span></span>
      <span></span>
      <span></span>
    </button>

    <div id="main-menu" class="nav-links" [class.is-open]="menuOpen()">
      <a class="button button-small" routerLink="/entrar">
        Entrar
      </a>
    </div>
  </nav>
</header>
