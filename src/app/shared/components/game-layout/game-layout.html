<div class="layout">
  <aside class="sidebar" [class.aberta]="menuAberto()" aria-label="Menu do jogo">
    <a routerLink="/" class="sidebar-logo" aria-label="Ir para a home do site">
      <img
        src="/images/logo_Orcamento_de_Guerra_principal.png"
        alt="Orçamento de Guerra"
        class="sidebar-logo-img"
      />
    </a>

    <nav class="sidebar-nav">
      <ul class="sidebar-lista">
        @for (item of itensMenu; track item.rota) {
          <li>
            <a
              class="sidebar-link"
              [routerLink]="item.rota"
              routerLinkActive="ativo"
              (click)="fecharMenu()"
            >
              <span class="sidebar-icone" aria-hidden="true">
                @switch (item.icone) {
                  @case ('jornada') {
                    <svg
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.6"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <path d="M3 11 12 4l9 7" />
                      <path d="M5 10v10h14V10" />
                      <path d="M9 20v-6h6v6" />
                    </svg>
                  }
                  @case ('caderno') {
                    <svg
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.6"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <path
                        d="M5 4h11a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"
                      />
                      <path d="M9 4v18" />
                      <path d="M13 9h3M13 13h3" />
                    </svg>
                  }
                  @case ('conquistas') {
                    <svg
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.6"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <circle cx="12" cy="9" r="6" />
                      <path d="M9 14.5 7 22l5-3 5 3-2-7.5" />
                    </svg>
                  }
                  @case ('timeline') {
                    <svg
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.6"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <path d="M3 17 9 11l4 4 8-8" />
                      <path d="M15 7h6v6" />
                    </svg>
                  }
                  @case ('perfil') {
                    <svg
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.6"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <circle cx="12" cy="8" r="4" />
                      <path d="M4 21c0-4 4-6 8-6s8 2 8 6" />
                    </svg>
                  }
                }
              </span>
              <span class="sidebar-label">{{ item.label }}</span>
            </a>
          </li>
        }
      </ul>
    </nav>

    <button type="button" class="sidebar-sair" (click)="sair()">
      <span class="sidebar-icone" aria-hidden="true">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3" />
          <path d="M10 17l-5-5 5-5" />
          <path d="M5 12h12" />
        </svg>
      </span>
      <span class="sidebar-label">Sair</span>
    </button>
  </aside>

  @if (menuAberto()) {
    <div class="sidebar-overlay" (click)="fecharMenu()" aria-hidden="true"></div>
  }

  <div class="layout-principal">
    <app-game-hud></app-game-hud>

    <main class="layout-conteudo">
      <header class="topbar-mobile">
        <button type="button" class="btn-menu" aria-label="Abrir menu" (click)="toggleMenu()">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M4 6h16M4 12h16M4 18h16"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>
        </button>
      </header>

      <ng-content></ng-content>
    </main>
  </div>
</div>
